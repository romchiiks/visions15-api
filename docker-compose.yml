services:
  automation-api:
    build: .
    container_name: visions-15-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-minio:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-visions15-datasets}"
      S3_SECURE: "${S3_SECURE:-false}"
      S3_PUBLIC_BASE_URL: "${S3_PUBLIC_BASE_URL:-http://localhost:9000/visions15-datasets}"
      S3_BUCKET_PUBLIC_READ: "${S3_BUCKET_PUBLIC_READ:-true}"
      MODEL_S3_BUCKET: "${MODEL_S3_BUCKET:-visions15-models}"
      MODEL_S3_PREFIX: "${MODEL_S3_PREFIX:-model}"
    volumes:
      - ${VISIONS15_DATA_ROOT:?Set VISIONS15_DATA_ROOT in .env}/storage:/app/storage
      - ${VISIONS15_DATA_ROOT:?Set VISIONS15_DATA_ROOT in .env}/files:/label-studio/files
    depends_on:
      - label-studio
      - minio

  label-studio:
    image: heartexlabs/label-studio:1.23.0
    container_name: label-studio
    ports:
      - "8080:8080"
    environment:
      LABEL_STUDIO_HOST: "http://localhost:8080"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8080"
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: "/label-studio/files"
    volumes:
      - ${VISIONS15_DATA_ROOT:?Set VISIONS15_DATA_ROOT in .env}/label-studio-data:/label-studio/data
      - ${VISIONS15_DATA_ROOT:?Set VISIONS15_DATA_ROOT in .env}/files:/label-studio/files

  minio:
    image: minio/minio:latest
    container_name: visions-15-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-minioadmin}"
    volumes:
      - ${VISIONS15_DATA_ROOT:?Set VISIONS15_DATA_ROOT in .env}/minio-data:/data
